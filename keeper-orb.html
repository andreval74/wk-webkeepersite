<!--
  keeper-orb.html — página de demonstração/showcase standalone do "Keeper
  Orb" (a esfera animada com olhos que representa a IA da WebKeeper).
  Não é linkada a partir do site principal; serve como vitrine isolada do
  componente. Depende de: styles.css (seção "Keeper Orb") e keeper-orb.js.
-->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keeper — Orbe</title>
<meta name="description" content="Conheça o Keeper, o orbe animado de IA da WebKeeper. Um componente visual que representa a inteligência e a energia da marca WebKeeper.">
<meta property="og:type" content="website">
<meta property="og:title" content="Keeper — Orbe">
<meta property="og:description" content="Conheça o Keeper, o orbe animado de IA da WebKeeper. Um componente visual que representa a inteligência e a energia da marca WebKeeper.">
<meta property="og:image" content="https://www.webkeeper.com.br/images/logoWK.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="keeper-stage">
    <div class="keeper-orb" id="keeperOrb">
      <div class="keeper-halo"></div>
      <div class="keeper-halo-warm"></div>
      <div class="keeper-bloom"></div>
      <div class="keeper-ring-wrap">
        <div class="keeper-ring"></div>
      </div>
      <div class="keeper-sphere"></div>
      <div class="keeper-highlight"></div>
      <div class="keeper-eyes" id="keeperEyes">
        <span class="keeper-eye"></span>
        <span class="keeper-eye"></span>
      </div>
    </div>
  </div>

<script src="./keeper-orb.js"></script>
<script>
  (function () {
    var orb = document.getElementById('keeperOrb');
    var eyes = document.getElementById('keeperEyes');
    if (!orb || !eyes) return;

    KeeperOrb.attachGaze(eyes, { anchorEl: orb, mode: 'proportional', max: 8, divisor: 12, ease: 0.5 });

    // demonstração automática: fala por ~2.6s a cada ~3.8s de silêncio
    var autoTimer = null;
    (function loopDemo() {
      KeeperOrb.setMood(orb, 'speaking');
      autoTimer = setTimeout(function () {
        KeeperOrb.setMood(orb, 'idle');
        autoTimer = setTimeout(loopDemo, 3800);
      }, 2600);
    })();

    orb.addEventListener('click', function () {
      clearTimeout(autoTimer);
      KeeperOrb.setMood(orb, orb.classList.contains('is-speaking') ? 'idle' : 'speaking');
    });
  })();
</script>
</body>
</html>
