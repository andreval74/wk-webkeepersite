<!--
  WebKeeper.html — página inicial do site (index.html redireciona pra cá).
  É o widget de chat do "Keeper", o assistente de IA da WebKeeper — não a
  landing page institucional completa (essa é WebKeeper-site.html).
  Depende de: support.js (runtime que renderiza o bloco x-dc), styles.css,
  keeper-orb.js (animação do orbe) e api/keeper.php (backend do chat).
-->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body class="keeper-page-body">
<x-dc>

<helmet>
  <title>Keeper | Assistente de IA da WebKeeper</title>
  <meta name="description" content="Converse com o Keeper, a IA da WebKeeper, e descubra a melhor solução para o seu negócio: IA, automação, Web3, sistemas sob medida e SEO.">
  <meta name="keywords" content="webkeeper, keeper ia, assistente de ia, agência de tecnologia, inteligência artificial para empresas">
  <meta name="author" content="WebKeeper">
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1">
  <meta name="language" content="pt-BR">
  <meta name="theme-color" content="#05070d">
  <link rel="canonical" href="https://www.webkeeper.com.br/">
  <link rel="icon" href="./images/wk-shield.png" type="image/png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="WebKeeper">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:title" content="Keeper | Assistente de IA da WebKeeper">
  <meta property="og:description" content="Converse com o Keeper, a IA da WebKeeper, e descubra a melhor solução para o seu negócio.">
  <meta property="og:image" content="https://www.webkeeper.com.br/images/wk-shield.png">
  <meta property="og:url" content="https://www.webkeeper.com.br/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Keeper | Assistente de IA da WebKeeper">
  <meta name="twitter:image" content="https://www.webkeeper.com.br/images/wk-shield.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <script src="./keeper-orb.js"></script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "WebKeeper",
    "url": "https://www.webkeeper.com.br/",
    "logo": "https://www.webkeeper.com.br/images/wk-shield.png",
    "sameAs": ["https://www.facebook.com/webkeeperia/", "https://www.instagram.com/webkeeperia", "https://www.linkedin.com/company/webkeeper"]
  }
  </script>
</helmet>

<div class="keeper-page">
  <div class="keeper-bg-spot"></div>

  <header class="keeper-header">
    <div class="keeper-brand">
      <img src="./images/wk-shield.png" alt="WebKeeper">
      <span class="keeper-brand-text">web<span style="color:#5FA625;">keeper</span></span>
    </div>
  </header>

  <main class="keeper-main">

    <div style="display:flex;flex-direction:column;align-items:center;flex-shrink:0;">
      <div ref="{{ orbRef }}" class="keeper-orb keeper-orb-wrapper {{ M.moodClass }}">
        <sc-if value="{{ bursting }}" hint-placeholder-val="{{ false }}">
          <div style="position:absolute;inset:0;pointer-events:none;">
            <sc-for list="{{ burstIcons }}" as="ic" hint-placeholder-count="6">
              <div style="position:absolute;left:50%;top:50%;width:0;height:0;transform:translate(-50%,-50%) rotate({{ ic.angle }}deg);">
                <div style="width:26px;height:26px;margin-top:-13px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:rgba(10,16,32,.85);border:1px solid rgba(255,255,255,.12);animation:kp-burst-out 1.3s ease-out {{ ic.delay }}s both;">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#9fdc6e" stroke-width="1.8" style="transform:rotate({{ ic.counterAngle }}deg);"><path d="{{ ic.path }}"></path></svg>
                </div>
              </div>
            </sc-for>
          </div>
        </sc-if>
        <div class="keeper-bloom"></div>
        <div class="keeper-ring-wrap"><div class="keeper-ring"></div></div>
        <div class="keeper-sphere"></div>
        <div class="keeper-highlight"></div>
        <div class="keeper-eyes" style="transform:{{ gazeStyle }};">
          <span class="keeper-eye"></span>
          <span class="keeper-eye"></span>
        </div>
      </div>
      <h1 class="keeper-title">Keeper</h1>
      <p class="keeper-status">{{ statusLine }}</p>
    </div>

    <div class="keeper-panel">
      <div ref="{{ scrollRef }}" class="keeper-messages">
        <sc-if value="{{ hasUserQuestion }}" hint-placeholder-val="{{ false }}">
          <p class="kp-msg" style="margin:0;font-size:10.5px;color:#6b7290;">Você perguntou: {{ lastUserQuestion }}</p>
        </sc-if>
        <div class="kp-msg" style="font-size:12.5px;line-height:1.6;color:#dfe3f0;"><sc-for list="{{ answerSegments }}" as="seg" hint-placeholder-count="1"><sc-if value="{{ seg.isLink }}" hint-placeholder-val="{{ false }}"><a href="{{ seg.href }}" target="_blank" rel="noopener noreferrer" style="{{ seg.style }}">{{ seg.text }}</a></sc-if><sc-if value="{{ !seg.isLink }}" hint-placeholder-val="{{ true }}"><span style="{{ seg.style }}">{{ seg.text }}</span></sc-if></sc-for><span style="animation:kp-cursor 1s step-end infinite;">▍</span></div>
      </div>
      <div style="border-top:1px solid rgba(255,255,255,.08);display:flex;gap:10px;align-items:center;padding:10px 10px 10px 18px;">
        <div style="position:relative;flex:1;min-width:0;">
          <div aria-hidden="true" style="position:absolute;inset:0;display:flex;align-items:center;pointer-events:none;font-size:14.5px;font-family:inherit;white-space:pre;overflow:hidden;"><span style="color:transparent;">{{ input }}</span><span style="color:#4d5573;">{{ ghostRemainder }}</span></div>
          <input ref="{{ inputRef }}" value="{{ input }}" onChange="{{ onInputChange }}" onKeyDown="{{ onKeyDown }}" placeholder="Pergunte sobre a WebKeeper…" class="keeper-chat-input">
        </div>
        <button onClick="{{ send }}" aria-label="Enviar" class="kp-send-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"></path></svg>
        </button>
      </div>
    </div>

    <p class="keeper-quote">Prefere navegar? Conheça nosso site:</p>
    <div class="keeper-site-links">
      <a href="./WebKeeper-site.html" class="keeper-site-link">
        Entrar no site
      </a>
    </div>
  </main>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">

const SYSTEM_PROMPT = `Você é o Keeper, o assistente de IA da WebKeeper — uma fábrica de ideias e parceira de tecnologia (não uma agência genérica). A WebKeeper oferece: Inteligência Artificial aplicada (agentes de atendimento, análise preditiva), Automação de Processos (integrações, workflows), Web3 & Blockchain (smart contracts, tokenização), Sistemas sob Medida (plataformas, dashboards), SEO & Performance, e Produtos Digitais (landing pages, SaaS). O processo é: Diagnóstico -> Planejamento -> Desenvolvimento -> Entrega & Suporte. Não trabalha com planos fechados: cada proposta é sob consulta, personalizada, enviada em até 24h. Oferece um Diagnóstico Digital gratuito. Também avalia modelos de parceria com equity para ideias em estágio inicial sem verba. Atendimento 100% via WhatsApp, 24h, direto sem intermediários, link https://wa.me/5543999446606. Atende empresas em Londrina, Apucarana, São Paulo, outras cidades do Brasil e nos EUA.

REGRA DE CONTATO: sempre que mencionar "fale conosco", "entre em contato" ou WhatsApp, inclua NA MESMA RESPOSTA um link clicável apontando para https://wa.me/5543999446606 — nunca escreva o número de telefone por extenso na resposta.

REGRA DE LINK: nunca escreva uma URL crua na resposta (nunca digite "https://..." como texto). Sempre que precisar citar o WhatsApp, transforme a própria palavra "WhatsApp" no link, assim: [WhatsApp](https://wa.me/5543999446606) — nunca use um rótulo fixo tipo "[chame no WhatsApp]" colado à força na frase, o rótulo do link tem que encaixar naturalmente na gramática da frase que você está escrevendo (ex.: "fale conosco pelo [WhatsApp](https://wa.me/5543999446606)", "chame no [WhatsApp](https://wa.me/5543999446606)"). Para outros links (ex: Versão Business), use o mesmo princípio: [texto curto](URL) que se encaixe na frase.

REGRA DE PIVÔ COMERCIAL: se o usuário pedir algo que não é um serviço da WebKeeper (ex.: comida, produto físico, serviço de terceiro) mas descrever um negócio real, não apenas recuse: diga em uma frase curta que isso não é da WebKeeper, e na mesma resposta ofereça a solução tecnológica adjacente que a WebKeeper construiria para esse tipo de negócio (site, sistema de pedidos, automação, divulgação). Nunca finja prestar o serviço fim. Se a pergunta não tiver relação alguma com negócio/tecnologia, apenas diga educadamente que só fala sobre a WebKeeper, sem forçar um pivô artificial.

Responda SOMENTE perguntas relacionadas à WebKeeper, seus serviços, processo, diagnóstico, parcerias ou tecnologia aplicada ao negócio do usuário (aplicando a regra de pivô acima quando fizer sentido).
Vá direto ao ponto que foi perguntado, sem rodeios. NÃO se reapresente, não repita "eu sou o Keeper" nem "assistente da WebKeeper" — isso já foi dito na saudação inicial, o usuário já sabe. Responda em no máximo 1 a 2 frases curtas, com a confiança de um negociador sênior: direto, com leve humor seco e, quando couber, uma provocação sutil que empurre para o fechamento (ex.: quanto custa NÃO ter isso, o que o concorrente já está fazendo).

REGRA DE ENCAMINHAMENTO: seja persuasivo e, na maior parte das respostas, puxe o usuário para um próximo passo. O tipo de fechamento a usar em CADA resposta específica (WhatsApp, pergunta de volta, site completo, ou resposta direta sem CTA) vem definido por uma "INSTRUÇÃO DE FECHAMENTO PARA ESTA RESPOSTA" anexada no final deste prompt — siga exatamente ela, é o que garante a variação real entre respostas em vez de você tentar adivinhar. É a variação que faz a conversa soar com alguém de verdade, não um roteiro decorado.

REGRA DE VARIAÇÃO: nunca comece duas respostas seguidas com a mesma palavra, a mesma estrutura de frase ou o mesmo gancho, e nunca repita literalmente algo que você já disse antes nessa conversa. Mude o ritmo, o ângulo e o exemplo a cada resposta — prefira trazer um detalhe, comparação ou provocação nova a reciclar a mesma ideia com outras palavras. A base de conhecimento abaixo (quando enviada) é só fatos de referência, NUNCA um texto pronto pra copiar — leia o fato e escreva a resposta do zero, com suas próprias palavras, aplicando a REGRA DE ENCAMINHAMENTO acima; se duas perguntas forem parecidas, a resposta tem que sair visivelmente diferente na estrutura, não só trocando um sinônimo. Nunca invente preços exatos — diga que é sob consulta. Responda em prosa simples, sem títulos, sem listas com hífen e sem emojis. No máximo 1 destaque em **negrito** por resposta, só se for realmente o dado central.`;

const GREETING = 'Olá! Seja bem-vindo. Eu sou o **Keeper**, o assistente virtual da empresa **WebKeeper**. Digite a sua pergunta ou selecione uma das opções abaixo para entrar no nosso site.';

const SERVICE_ICONS = [
  'M12 2a5 5 0 0 0-5 5v1a4 4 0 0 0-2 7v1a3 3 0 0 0 3 3h1a5 5 0 0 0 10 0h1a3 3 0 0 0 3-3v-1a4 4 0 0 0-2-7V7a5 5 0 0 0-5-5z',
  'M8 4l-5 8 5 8M16 4l5 8-5 8',
  'M12 2 3 7v10l9 5 9-5V7zM12 2v20M3 7l9 5 9-5',
  'M4 4h16v16H4zM4 9h16M9 13l2 2 4-4',
  'M11 5a6 6 0 1 0 0 12 6 6 0 0 0 0-12zM20 20l-4.35-4.35',
  'M7 2h10a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1zM11 18h2'
];

function parseSegments(text) {
  const linkRe = /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g;
  const chunks = [];
  let lastIndex = 0, m;
  while ((m = linkRe.exec(text)) !== null) {
    if (m.index > lastIndex) chunks.push({ raw: text.slice(lastIndex, m.index) });
    chunks.push({ label: m[1], href: m[2] });
    lastIndex = m.index + m[0].length;
  }
  if (lastIndex < text.length) chunks.push({ raw: text.slice(lastIndex) });

  const segments = [];
  chunks.forEach(c => {
    if (c.href) {
      segments.push({ text: c.label, href: c.href, isLink: true, style: 'color:#9fdc6e;text-decoration:underline;cursor:pointer;' });
    } else {
      c.raw.split(/\*\*(.+?)\*\*/g).forEach((t, i) => segments.push({ text: t, isLink: false, style: i % 2 === 1 ? 'font-weight:700;color:#9fdc6e;' : '' }));
    }
  });
  return segments;
}

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.inputRef = React.createRef();
    this.scrollRef = React.createRef();
    this.orbRef = React.createRef();
    this.state = { messages: [], input: '', loading: false, mood: 'idle', burstSeed: 0, gaze: { x: 0, y: 5 } };
    this.suggestionPrompts = [
      'Quero criar um site para minha empresa',
      'Como funciona a automação com inteligência artificial?',
      'Quero conhecer a WebKeeper',
      'Quanto custa um projeto?',
      'Vocês fazem sistemas com Web3 ou blockchain?',
      'Como funciona o diagnóstico gratuito?'
    ];
    this.MOODS = {
      idle: { moodClass: '', caption: '' },
      surprised: { moodClass: 'is-surprised', caption: 'Ótima pergunta!' },
      thinking: { moodClass: 'is-thinking', caption: 'Pensando…' }
    };
    this.onMouseMove = this.onMouseMove.bind(this);
    this.onMouseLeave = this.onMouseLeave.bind(this);
  }

  componentDidMount() {
    window.addEventListener('mousemove', this.onMouseMove);
    document.addEventListener('mouseleave', this.onMouseLeave);
    setTimeout(() => { this.burst(); }, 300);
  }

  componentWillUnmount() {
    window.removeEventListener('mousemove', this.onMouseMove);
    document.removeEventListener('mouseleave', this.onMouseLeave);
  }

  onMouseMove(e) {
    if (this.state.mood !== 'idle' || !this.orbRef.current) return;
    const r = this.orbRef.current.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const dx = e.clientX - cx, dy = e.clientY - cy;
    const dist = Math.hypot(dx, dy) || 1;
    const mag = 10.5;
    this.setState({ gaze: { x: (dx / dist) * mag, y: (dy / dist) * mag } });
  }

  onMouseLeave() { this.setState({ gaze: { x: 0, y: 5 } }); }

  componentDidUpdate() {
    if (this.scrollRef.current) this.scrollRef.current.scrollTop = this.scrollRef.current.scrollHeight;
  }

  burst() {
    clearTimeout(this._burstTimer);
    this.setState({ bursting: false }, () => {
      requestAnimationFrame(() => this.setState({ bursting: true }));
      this._burstTimer = setTimeout(() => this.setState({ bursting: false }), 4200);
    });
  }

  logQA(question, answer) {
    try {
      const key = 'keeper_qa_log';
      const log = JSON.parse(localStorage.getItem(key) || '[]');
      log.push({ q: question, a: answer, t: new Date().toISOString() });
      localStorage.setItem(key, JSON.stringify(log.slice(-200)));
    } catch (e) {}
  }

  // A cada novo visitante/sessão, o Keeper relê o próprio histórico acumulado
  // (deste navegador) e injeta os padrões aprendidos direto no prompt que consulta.
  buildSystemPrompt() {
    try {
      const log = JSON.parse(localStorage.getItem('keeper_qa_log') || '[]');
      if (!log.length) return SYSTEM_PROMPT;
      const uniq = [];
      const seen = new Set();
      for (let i = log.length - 1; i >= 0 && uniq.length < 6; i--) {
        const key = log[i].q.trim().toLowerCase();
        if (seen.has(key)) continue;
        seen.add(key);
        uniq.push(log[i]);
      }
      const learned = uniq.reverse().map(e => '- P: ' + e.q + '\n  R aprovada: ' + e.a.replace(/\n+/g, ' ')).join('\n');
      return SYSTEM_PROMPT + '\n\nAPRENDIZADO DE CONVERSAS ANTERIORES (use como referência de padrão de resposta; não repita literalmente, adapte ao contexto atual):\n' + learned;
    } catch (e) { return SYSTEM_PROMPT; }
  }

  getGhost(input) {
    if (!input) return '';
    const low = input.toLowerCase();
    const match = this.suggestionPrompts.find(p => p.toLowerCase().startsWith(low) && p.length > input.length);
    return match || '';
  }

  async send(text) {
    const msg = (typeof text === 'string' ? text : this.state.input).trim();
    if (!msg || this.state.loading) return;
    const history = [...this.state.messages, { role: 'user', text: msg }];
    this.setState({ messages: history, input: '', loading: true, mood: 'surprised' });
    await new Promise(r => setTimeout(r, 550));
    this.setState({ mood: 'thinking' });
    try {
      const apiMessages = history.map(m => ({ role: m.role, content: m.text }));
      const res = await fetch('./api/keeper.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ system: this.buildSystemPrompt(), messages: apiMessages, max_tokens: 160 })
      });
      const data = await res.json();
      if (!res.ok || !data.reply) throw new Error(data.error || 'Falha na resposta');
      let reply = data.reply;
      reply = reply.replace(/^#+\s*/gm, '').replace(/^[-*]\s+/gm, '').replace(/`/g, '').replace(/(?<!\*)\*(?!\*)/g, '').replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, '').trim();
      this.setState(s => ({ messages: [...s.messages, { role: 'assistant', text: reply }], loading: false, mood: 'idle' }));
      this.burst();
      this.logQA(msg, reply);
    } catch (e) {
      const fallback = 'Não consegui responder agora. Tente de novo ou [chame no WhatsApp](https://wa.me/5543999446606).';
      this.setState(s => ({ messages: [...s.messages, { role: 'assistant', text: fallback }], loading: false, mood: 'idle' }));
      this.burst();
    }
  }

  onKeyDown(e) {
    const ghost = this.getGhost(this.state.input);
    if (e.key === 'Tab' && ghost) { e.preventDefault(); this.setState({ input: ghost }); return; }
    if (e.key === 'Enter') {
      if (ghost && this.state.input !== ghost) { e.preventDefault(); this.setState({ input: ghost }); this.send(ghost); return; }
      this.send();
    }
  }

  renderVals() {
    const s = this.state;
    const M = this.MOODS[s.mood] || this.MOODS.idle;
    const ghost = this.getGhost(s.input);
    return {
      M, orbRef: this.orbRef,
      gazeStyle: 'translate(calc(-50% + ' + s.gaze.x + 'px), calc(-50% + ' + s.gaze.y + 'px))',
      statusLine: M.caption,
      bursting: s.bursting,
      burstIcons: Array.from({ length: 6 }).map((_, i) => ({ angle: i * 60, counterAngle: -(i * 60), delay: (i * 0.07).toFixed(2), path: SERVICE_ICONS[i] })),
      hasUserQuestion: s.messages.some(m => m.role === 'user'),
      lastUserQuestion: (() => { const u = s.messages.filter(m => m.role === 'user'); return u.length ? u[u.length - 1].text : ''; })(),
      answerSegments: (() => { const a = s.messages.filter(m => m.role === 'assistant'); return parseSegments(a.length ? a[a.length - 1].text : GREETING); })(),
      loading: s.loading,
      input: s.input,
      ghostRemainder: ghost ? ghost.slice(s.input.length) : '',
      inputRef: this.inputRef,
      scrollRef: this.scrollRef,
      onInputChange: (e) => this.setState({ input: e.target.value }),
      onKeyDown: (e) => this.onKeyDown(e),
      send: () => this.send()
    };
  }
}

</script>
</body>
</html>
